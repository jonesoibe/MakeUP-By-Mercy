<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakeUP By Mercy - Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f3efe8;
            --sand: #e9e2d7;
            --mocha: #4a3a33;
            --mocha-deep: #2e2420;
            --ink: #2b2328;
            --muted: #6b5f5b;
            --clay: #8c6a5a;
            --blush: #d8b9a8;
            --line: rgba(43, 35, 40, 0.14);
            --border: rgba(43, 35, 40, 0.22);
            --serif: 'Cormorant Garamond', 'Times New Roman', serif;
            --sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.55;
            color: var(--ink);
            background: var(--mocha-deep);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
        ::selection { background: var(--blush); color: var(--mocha-deep); }

        .login-container {
            background: var(--cream);
            padding: clamp(28px, 6vw, 48px);
            border-radius: 4px;
            max-width: 440px;
            width: calc(100% - 32px);
            animation: popIn 520ms var(--ease-out);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }

        .login-header { text-align: left; margin-bottom: 32px; }

        .login-header .eyebrow {
            display: block;
            margin-bottom: 14px;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--clay);
        }

        .login-header h1 {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(2.6rem, 8vw, 3.5rem);
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .login-header h1 em { font-style: italic; }
        .login-header p { color: var(--muted); font-size: 0.9375rem; }

        .form-group { margin-bottom: 22px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 0;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 200ms ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus { outline: none; border-color: var(--ink); }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--ink);
            color: var(--cream);
            border: none;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 200ms ease, transform 160ms ease-out, opacity 200ms ease;
        }

        .login-btn:active { transform: scale(0.97); }
        @media (hover: hover) { .login-btn:hover { background: var(--mocha); } }
        .login-btn.loading { opacity: 0.6; cursor: not-allowed; }

        .error-message,
        .success-message {
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.875rem;
        }

        .error-message { background: rgba(166, 61, 61, 0.1); color: #8f3434; border: 1px solid rgba(166, 61, 61, 0.3); }
        .success-message { background: rgba(108, 125, 92, 0.14); color: #4f6340; border: 1px solid rgba(108, 125, 92, 0.35); }

        .error-message.show,
        .success-message.show { display: block; animation: slideIn 280ms var(--ease-out); }

        @keyframes slideIn {
            from { transform: translateY(-8px); opacity: 0; }
            to { transform: none; opacity: 1; }
        }

        .remember-me { display: flex; align-items: center; margin-bottom: 20px; }
        .remember-me input { margin-right: 10px; cursor: pointer; accent-color: var(--ink); }
        .remember-me label { margin-bottom: 0; cursor: pointer; letter-spacing: 0.02em; text-transform: none; font-size: 0.875rem; font-weight: 400; }

        .demo-credentials {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            font-size: 0.75rem;
            color: var(--muted);
        }

        .demo-credentials strong { color: var(--ink); font-weight: 500; }

        .back-link { margin-top: 20px; }

        .back-link a {
            color: var(--ink);
            text-decoration: none;
            font-size: 0.8125rem;
            padding-bottom: 4px;
            border-bottom: 1px solid currentColor;
            transition: opacity 200ms ease;
        }

        .back-link a:hover { opacity: 0.6; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="eyebrow">MakeUP By Mercy</span>
            <h1>Admin <em>console.</em></h1>
            <p>Sign in to manage bookings, pricing and availability.</p>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message">Login successful! Redirecting...</div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="Enter admin username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Remember me</label>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Login to Admin Console
            </button>
        </form>

        <div class="demo-credentials">
            <strong>🔐 Secure Login</strong><br>
            <small>Uses encrypted JWT tokens and bcrypt password hashing</small><br>
            <small style="display: block; margin-top: 10px;">Contact your administrator for credentials</small>
        </div>

        <div class="back-link">
            <a href="/">← Back to Website</a>
        </div>
    </div>

    <script src="/admin-login.js"></script>
</body>
</html>
